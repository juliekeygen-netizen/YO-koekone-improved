name: One-time corrected final v1.0 audit fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply final audit fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const read = path => fs.readFileSync(path, 'utf8');
          const write = (path, value) => fs.writeFileSync(path, value.replace(/\r\n/g, '\n'), 'utf8');
          function replaceExact(path, from, to, label = path) {
            const source = read(path);
            if (!source.includes(from)) throw new Error(`Expected ${label} source was not found`);
            write(path, source.replace(from, to));
          }

          // Firefox's data_collection_permissions manifest key is supported from 140.
          replaceExact(
            'scripts/build.mjs',
            "strict_min_version: '128.0'",
            "strict_min_version: '140.0'",
            'Firefox minimum-version marker'
          );

          // Keep the YO+ status after Yle's native action buttons even if React adds
          // Muokkaa after a very fast Tarkista click.
          replaceExact(
            'src/features-v03/draft-ui.js',
            `    if (actionRow) {\n      if (row.parentElement !== actionRow) actionRow.appendChild(row);\n    } else {`,
            `    if (actionRow) {\n      // React can add Muokkaa after this status row already exists. Re-evaluate\n      // native action order on every render instead of checking only the parent.\n      const nativeButtons = [...actionRow.querySelectorAll('button')].filter(button =>\n        button.closest(SELECTORS.question) === q && !button.closest(\`.\${ROW_CLASS}\`)\n      );\n      const editButton = nativeButtons.find(button =>\n        button.matches?.(SELECTORS.edit) ||\n        /^Muokkaa$/i.test(String(button.getAttribute('aria-label') || button.textContent || '').trim())\n      );\n      const anchor = editButton || nativeButtons[nativeButtons.length - 1] || null;\n      if (anchor) {\n        if (anchor.nextSibling !== row) anchor.after(row);\n      } else if (actionRow.lastElementChild !== row) {\n        actionRow.appendChild(row);\n      }\n    } else {`,
            'draft status action-row placement block'
          );

          const optionsHtml = String.raw`<!doctype html>
          <html lang="fi">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>YO+ – Asetukset</title>
            <link rel="stylesheet" href="options.css">
          </head>
          <body>
            <main>
              <header class="hero">
                <div class="mark">YO+</div>
                <div>
                  <p class="eyebrow">YO+</p>
                  <h1>Asetukset</h1>
                  <p>Perusparannukset, kuten URL-seuranta, taustavälilehdet ja välilehtien nimet, ovat aina käytössä. Täällä säädetään vain valinnaisia ominaisuuksia.</p>
                </div>
              </header>

              <div class="grid">
                <section class="featured"><h2>Etusivu</h2>
                  <label><span><b>Harjoittelun pikavalinnat</b><small>Näytä Jatka viimeisintä, viimeksi avatut ja suosikit ennen oppiaineen valintaa.</small></span><input type="checkbox" data-setting="studyHub"></label>
                  <label data-home-dependent><span><b>Näytä kysymysharjoittelut pikavalinnoissa</b><small>Lisää Harjoittele kysymyksillä -sessiot Jatka- ja Viimeksi avatut -kohtiin.</small></span><input type="checkbox" data-setting="showQuestionPracticeInHub"></label>
                  <label data-question-session-detail><span><b>Vain yksi kysymysharjoittelusessio</b><small>Näytä viimeksi avatuissa vain uusin kysymyssessio, jotta kokeille jää tilaa.</small></span><input type="checkbox" data-setting="singleQuestionPracticeRecent"></label>
                  <div class="number-row" data-home-dependent><span><b>Viimeksi avattuja</b><small>Rivien kokonaismäärä kokeista ja kysymysharjoittelusta.</small></span><input type="number" min="1" max="10" step="1" data-number="recentLimit"></div>
                </section>

                <div class="options-columns">
                  <div class="options-column">
                    <section><h2>Vastaukset ja luonnokset</h2>
                      <label><span><b>Paikallinen luonnostallennus</b><small>Suojaa tarkistamattomat vastaukset tässä välilehdessä.</small></span><input type="checkbox" data-setting="localDrafts"></label>
                      <label data-draft-dependent><span><b>Luonnoksen tilamerkintä</b><small>Näytä paikallisen tallennuksen tila tehtävän yhteydessä.</small></span><input type="checkbox" data-setting="draftStatus"></label>
                      <label><span><b>Välilehtiristiriitojen varoitus</b><small>Varoita, jos sama tarkistettu vastaus muuttuu toisessa välilehdessä.</small></span><input type="checkbox" data-setting="crossTabWarnings"></label>
                      <p class="info-note">Yksittäisen paikallisen luonnoksen poistaminen tehdään Yo-koekoneessa tehtävän tilamerkistä valinnalla <b>Poista paikallinen luonnos</b>. Se poistaa vain tämän lisäosan turvakopion eikä tyhjennä ruudulla näkyvää vastausta tai Ylen tarkistettua vastausta.</p>
                    </section>

                    <section><h2>Kokeet ja tehtävät</h2>
                      <label><span><b>Tarkat osatehtävälinkit</b><small>Mahdollistaa suorat reitit kuten tehtava-1.2, kun osatehtävä voidaan tunnistaa varmasti.</small></span><input type="checkbox" data-setting="subtaskLinks"></label>
                    </section>
                  </div>

                  <div class="options-column">
                    <section><h2>Kysymysharjoittelu</h2>
                      <label><span><b>Palauta sama satunnainen kysymyssarja</b><small>Säilyttää valitun kysymyssarjan F5:n ja historian jälkeen turvallisesti. Sekoita luo uuden sarjan.</small></span><input type="checkbox" data-setting="exactQuestionSetRestore"></label>
                    </section>

                    <section><h2>Sivun siistiminen</h2>
                      <label><span><b>Piilota “Miten Yo-koekone toimii?”</b><small>Piilota etusivun ohjekortti.</small></span><input type="checkbox" data-setting="hideHowItWorks"></label>
                      <label><span><b>Piilota kirjautumisohjeteksti</b><small>Piilota “Jotta saat harjoittelusta kaiken irti…” -kappale.</small></span><input type="checkbox" data-setting="hideLoginIntro"></label>
                      <label><span><b>Piilota kokeen infokortti</b><small>Piilota YTL:n kokeen asettelua koskeva infokortti.</small></span><input type="checkbox" data-setting="hideExamDisclaimer"></label>
                    </section>
                  </div>
                </div>
              </div>

              <footer>
                <div><button id="reset" class="secondary" type="button">Palauta oletukset</button><span id="saved" role="status" aria-live="polite"></span></div>
                <a href="https://yle.fi/abitreenit/harjoittele" target="_blank" rel="noreferrer">Avaa Yo-koekone</a>
              </footer>
            </main>
            <script src="settings-store.js"></script>
            <script src="i18n.js"></script>
            <script src="options.js"></script>
          </body>
          </html>
          `.replace(/^ {10}/gm, '');
          write('src/extension-ui/options.html', optionsHtml);

          const optionsCss = String.raw`:root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #111214;
            color: #f4f4f4;
          }
          * { box-sizing: border-box; }
          body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 75% -10%, rgba(255,142,118,.15), transparent 35%), #111214; }
          main { width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 46px 0 54px; }
          .hero { display: flex; align-items: flex-start; gap: 17px; margin-bottom: 30px; }
          .mark { display: grid; place-items: center; width: 58px; height: 58px; border-radius: 13px; background: #ff9a84; color: #111; font-weight: 950; font-size: 20px; flex: none; }
          .eyebrow { margin: 0 0 3px; color: #ffab9a; font-size: 12px; font-weight: 850; letter-spacing: .06em; text-transform: uppercase; }
          .hero h1 { margin: 0; font-size: 34px; line-height: 1.05; }
          .hero > div > p:last-child { max-width: 720px; margin: 7px 0 0; color: #aaacae; font-size: 14px; line-height: 1.5; }

          .grid { display: grid; gap: 16px; }
          .options-columns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
          .options-column { display: grid; gap: 16px; align-content: start; min-width: 0; }
          .grid section { min-width: 0; background: #1b1c1e; border: 1px solid #303235; border-radius: 12px; padding: 19px 20px; }
          .grid h2 { margin: 0 0 7px; font-size: 15px; color: #ffb1a2; }
          .grid label, .number-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 11px 0; border-top: 1px solid #2e3032; cursor: pointer; }
          .grid h2 + label, .grid h2 + .number-row { border-top: 0; }
          .grid label > span, .number-row > span { display: grid; gap: 3px; min-width: 0; }
          .grid label b, .number-row b { font-size: 13.5px; }
          .grid small { color: #9ea0a3; font-size: 11.5px; line-height: 1.4; }
          .grid input[type=checkbox] { appearance: none; width: 38px; height: 21px; border: 0; border-radius: 99px; background: #44474a; position: relative; flex: none; cursor: pointer; }
          .grid input[type=checkbox]::after { content: ""; position: absolute; left: 2px; top: 2px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: transform .15s ease; }
          .grid input[type=checkbox]:checked { background: #ff927d; }
          .grid input[type=checkbox]:checked::after { transform: translateX(17px); }
          .grid input[type=number] { width: 78px; padding: 8px 9px; border: 1px solid #56585b; border-radius: 8px; background: #111214; color: #fff; font: inherit; }
          .grid input:disabled { opacity: .42; cursor: not-allowed; }
          .grid label:has(input:disabled), .number-row:has(input:disabled) { opacity: .55; cursor: default; }

          .info-note { margin: 12px 0 0; padding: 12px 13px; border: 1px solid #343638; border-radius: 9px; background: #151618; color: #b7b9bb; font-size: 12px; line-height: 1.62; overflow-wrap: break-word; }
          .info-note b { color: #f1f1f1; font-size: inherit; font-weight: 800; }

          .grid input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid #ffb1a2; outline-offset: 3px; }
          footer { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-top: 22px; padding-top: 20px; border-top: 1px solid #303235; }
          footer > div { display: flex; align-items: center; gap: 13px; }
          button, a { font: inherit; font-size: 12px; font-weight: 800; }
          .secondary { border: 1px solid #65676a; border-radius: 999px; padding: 9px 13px; background: transparent; color: #fff; cursor: pointer; }
          footer a { border-radius: 999px; padding: 10px 14px; background: #f4f4f4; color: #111; text-decoration: none; }
          #saved { font-size: 11.5px; color: #83c99a; min-width: 85px; }

          @media (max-width: 760px) {
            main { padding-top: 28px; }
            .options-columns { grid-template-columns: 1fr; }
            .hero h1 { font-size: 28px; }
            footer { align-items: flex-start; flex-direction: column; }
          }
          `;
          write('src/extension-ui/options.css', optionsCss);

          // The clean public repo intentionally does not ship the old internal docs/
          // or permanent GitHub Actions workflows. Keep health checks focused on the
          // files that actually exist and on release/runtime invariants.
          let health = read('scripts/test-repo-health.mjs');
          health = health
            .replace(/^const storeSubmission = .*\n/m, '')
            .replace(/^const amoBuild = .*\n/m, '')
            .replace(/^const validateWorkflow = .*\n/m, '')
            .replace(/^const releaseWorkflow = .*\n/m, '')
            .replace(/^assert\(readme\.includes\(`docs\/AUDIT_[^\n]+\n/m, '')
            .replace(/^assert\(exists\(`docs\/AUDIT_[^\n]+\n/m, '')
            .replace(/^assert\(validateWorkflow[^\n]*\n/gm, '')
            .replace(/^assert\(releaseWorkflow[^\n]*\n/gm, '')
            .replace(/^assert\(storeSubmission[^\n]*\n/gm, '')
            .replace(/^assert\(amoBuild[^\n]*\n/gm, '')
            .replace(
              "for (const required of ['PRIVACY.md', 'docs/STORE_SUBMISSION.md', 'docs/AMO_SOURCE_BUILD.md', 'scripts/test-i18n.mjs', 'src/i18n.js', 'src/i18n-nondom.js']) {",
              "for (const required of ['PRIVACY.md', 'README.md', 'scripts/test-i18n.mjs', 'src/i18n.js', 'src/i18n-nondom.js']) {"
            )
            .replace("strict_min_version === '128.0'", "strict_min_version === '140.0'")
            .replace("'Firefox minimum version changed unexpectedly'", "'Firefox minimum must match manifest privacy API support'");

          if (!health.includes("const optionsHtml = read('src/extension-ui/options.html');")) {
            health = health.replace(
              "const extensionBackground = read('src/extension-background.js');",
              "const extensionBackground = read('src/extension-background.js');\nconst optionsHtml = read('src/extension-ui/options.html');\nconst optionsCss = read('src/extension-ui/options.css');"
            );
          }

          const extraHealth = `\nassert(draftUi.includes("const nativeButtons = [...actionRow.querySelectorAll('button')]"), 'draft status does not re-evaluate native action order');\nassert(draftUi.includes('const editButton = nativeButtons.find'), 'draft status does not prefer Muokkaa when it exists');\nassert(draftUi.includes('if (anchor.nextSibling !== row) anchor.after(row);'), 'draft status can remain before a late-mounted Muokkaa button');\nassert(optionsHtml.includes('class="options-columns"'), 'Options page is missing independent card columns');\nassert(optionsCss.includes('.options-column { display: grid;'), 'Options page cards are not independently stacked');\nassert(optionsCss.includes('.info-note b {'), 'Options draft-note emphasis styling regressed');\nassert(buildScript.includes("strict_min_version: '140.0'"), 'build would regenerate an outdated Firefox minimum');\n`;
          if (!health.includes('draft status does not re-evaluate native action order')) {
            health = health.replace("\nconsole.log('Repository / store-readiness health checks passed.');", `${extraHealth}\nconsole.log('Repository / store-readiness health checks passed.');`);
          }
          write('scripts/test-repo-health.mjs', health);

          let readme = read('README.md');
          readme = readme
            .replace('YO+ v0.7.0 added an interface language selector:', 'YO+ includes an interface language selector:')
            .replace('v0.7.2 hardens this gesture for Tampermonkey/content-script cross-realm DOM events by using `composedPath()` rather than `instanceof Element`.', 'The gesture is hardened for Tampermonkey/content-script cross-realm DOM events by using `composedPath()` rather than realm-sensitive DOM constructor checks.')
            .replace('Firefox 128+ is required by the current packaged MAIN-world exact-set bridge.', 'Firefox 140+ is required by the packaged extension so the manifest privacy declaration and supported browser APIs stay aligned.')
            .replace('GitHub Release artifacts:', 'Suggested release artifacts:');

          if (!readme.includes('## Source review / build')) {
            readme += `\n\n## Source review / build\n\nThe build uses Node.js built-ins and the committed source tree. For store/source review, use **Node.js 24.x** on Windows, macOS or Linux.\n\nFrom the repository root:\n\n\`\`\`bash\nnpm run build\nnpm run check\n\`\`\`\n\n\`npm run build\` regenerates the standalone userscript plus the Chrome and Firefox extension folders. \`npm run check\` verifies generated/source parity, runs the regression suite and syntax-checks the shipped JavaScript. No minifier, bundler package, remote code download or external npm dependency is required.\n`;
          }
          if (!readme.includes('## Maintenance')) {
            readme += `\n\n## Maintenance\n\nYO+ is considered feature-complete for what I wanted it to do, so I probably will not keep adding features just for the sake of it. If a browser update or a major Abitreenit change breaks the extension badly, I may try to fix it. Issues and pull requests are still welcome as reports or suggestions, but I cannot promise a response, a fix, or that a pull request will be merged.\n`;
          }
          write('README.md', readme);

          let extensionReadme = read('extensions/README.md');
          extensionReadme = extensionReadme
            .replace('Firefox 128+ is required by the packaged MAIN-world bridge', 'Firefox 140+ is required by the packaged extension')
            .replace(/\nFor AMO source review, see `\.\.\/docs\/AMO_SOURCE_BUILD\.md`\.\n/, '\nFor AMO/source review build instructions, see the **Source review / build** section in `../README.md`.\n')
            .replace('- store copy / screenshot checklist: `../docs/STORE_SUBMISSION.md`\n- AMO source/build notes: `../docs/AMO_SOURCE_BUILD.md`\n- current audit: `../docs/AUDIT_V070.md`\n', '- source/build review instructions: `../README.md`\n');
          write('extensions/README.md', extensionReadme);
          NODE

      - name: Regenerate distributions
        run: npm run build

      - name: Run complete validation
        run: npm run check

      - name: Commit verified fixes and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/final-audit-fix.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: final v1.0 UI and store-readiness audit"
          git push
